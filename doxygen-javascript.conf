# Consumer-side Doxygen configuration required by javascript-doxygen.
#
# The maintained filter preserves one physical output line for every input line.
# Doxygen aliases may introduce logical formatting during documentation parsing
# without changing the filter's source-line correspondence.

ALIASES += jsyields="@par Yields^^"
ALIASES += jstypedef{3||}="@page \1 \2^^@par JSDoc virtual type^^Base type: \3."
ALIASES += jsproperty{3||}="@par Property: \2^^Type: \1.^^\3"
ALIASES += jscallback{2||}="@page \1 \2^^@par JSDoc callback"
