---
name: Test javascript-doxygen

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        awk: [mawk, gawk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AWK implementation
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.awk }}
      - name: Run TAP regression suite
        run: make test AWK_BIN=${{ matrix.awk }}

  doxygen:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        awk: [mawk, gawk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install integration tools
        run: sudo apt-get update && sudo apt-get install -y doxygen ${{ matrix.awk }}
      - name: Run Doxygen integration suite
        run: make test-doxygen AWK_BIN=${{ matrix.awk }}
